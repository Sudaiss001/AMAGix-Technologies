    <text x="700" y="83" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">AMOUNT</text>
    <text x="920" y="83" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">STATUS</text>

    <!-- Row 1 -->
    <text x="45" y="130" fill="#8B5CF6" font-family="monospace" font-size="12">TXN_948120391</text>
    <text x="260" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="13">buyer@enterprise.ng</text>
    <text x="540" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="13">Card Payment</text>
    <text x="700" y="130" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">₦250,000.00</text>
    <rect x="920" y="112" width="90" height="24" rx="12" fill="#10B981" opacity="0.2" />
    <text x="965" y="128" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SUCCESS</text>
    <line x1="25" y1="150" x2="1095" y2="150" stroke="#334155" />

    <!-- Row 2 -->
    <text x="45" y="190" fill="#8B5CF6" font-family="monospace" font-size="12">TXN_948120392</text>
    <text x="260" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="13">client@techhub.com</text>
    <text x="540" y="190" fill="#CBD5E1" font-family="sans-serif" font-size="13">Bank Transfer</text>
    <text x="700" y="190" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">₦1,200,000.00</text>
    <rect x="920" y="172" width="90" height="24" rx="12" fill="#10B981" opacity="0.2" />
    <text x="965" y="188" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SUCCESS</text>
    <line x1="25" y1="210" x2="1095" y2="210" stroke="#334155" />
