    <rect x="590" y="55" width="500" height="38" rx="6" fill="#0F172A" />
    <text x="605" y="79" fill="#06B6D4" font-family="monospace" font-size="12">pk_live_8f912a73b9e4012c845291...</text>
    <text x="590" y="120" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">✓ Webhooks Active (200 OK • 12ms latency)</text>
  </g>

